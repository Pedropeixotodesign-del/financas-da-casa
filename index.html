    const r=gPayApply(m.id,e,f.m.pick.amount);f.m.act=r.act;f.m.reply=gPayReply(m.id,e,r.was);gCommit(f.mid)},
  "g-habit"(el){const f=gFind(el.dataset.msg);if(!f||!f.m.ask||f.m.ask.ans)return;const a=f.m.ask;const v=el.dataset.v;
    if(v==="tag"){const since=dateAdd(f.m.date,-6);for(const k in G){let ch=false;G[k].msgs.forEach(x=>{if(x.date>=since&&x.date<=f.m.date)x.items.forEach(i=>{if(noAcc(gKind(i)||"")===noAcc(a.kind)&&!i.tag){i.tag=a.tag;ch=true}})});if(ch&&k!==f.mid)gCommit(k)}a.reply=say("habit_tag",{tag:a.tag},f.m.id)}

    else a.reply=say("habit_cat",{cat:a.catLabel||gcat(a.cat).name},f.m.id);

});

function monthTemplate(id){
  const prev=S.months.filter(x=>x.id<id).slice(-1)[0];
  const exps=[];if(prev)prev.expenses.forEach(e=>{if(e.inst)return;const n=nextInstallment(e.desc);if(n.keep)exps.push({id:uid("e"),desc:n.desc,cat:e.cat,planned:e.planned,paid:0})});
  return {id,closed:false,expenses:exps,incomes:prev?prev.incomes.map(i=>({id:uid("i"),source:i.source,planned:i.planned,received:0})):[]};
}
function purchaseRowsFor(m){
  (S.purchases||[]).forEach(p=>{const k=diffM(p.start,m.id)+1;if(k<1||k>p.n)return;if(m.expenses.some(e=>e.inst&&e.inst.gid===p.id&&e.inst.k===k))return;
    m.expenses.push({id:uid("e"),desc:p.desc+" "+k+"/"+p.n,cat:p.cat,planned:instValue(p,k),paid:0,inst:{gid:p.id,k,n:p.n}})});
}
function instValue(p,k){const base=Math.floor(p.total/p.n*100)/100;return k===p.n?Math.round((p.total-base*(p.n-1))*100)/100:base}
function addPurchase(o,startM,n,paidFirst){
  const gid=uid("p");const p={id:gid,desc:o.desc,cat:o.cat,total:o.planned,n,start:startM};
  S.purchases=S.purchases||[];S.purchases.push(p);
  S.months.forEach(m=>purchaseRowsFor(m));
  const first=S.months.find(m=>m.id===startM);if(first&&paidFirst){const e=first.expenses.find(e=>e.inst&&e.inst.gid===gid&&e.inst.k===1);if(e)e.paid=Math.min(paidFirst,e.planned)}
  const base=S.debts.base||TODAY_M;
  S.debts.items.push({id:gid,name:o.desc+" (parcelado)",installment:instValue(p,1),currentAtBase:1-diffM(base,startM),total:n,purchase:true});
  return p;
}
function removePurchase(gid){
  S.purchases=(S.purchases||[]).filter(p=>p.id!==gid);
  S.months.forEach(m=>{m.expenses=m.expenses.filter(e=>!(e.inst&&e.inst.gid===gid))});
  S.debts.items=S.debts.items.filter(d=>d.id!==gid);
}

function goalInfo(g){
  const saved=Math.round((g.history||[]).reduce((t,h)=>t+(+h.value||0),0)*100)/100;const target=+g.target||0;
  const left=Math.max(0,target-saved);const ml=g.deadline?Math.max(1,diffM(TODAY_M,g.deadline)+1):0;
  return {saved,target,left,pct:target?Math.min(1,Math.max(0,saved/target)):0,monthsLeft:ml,perMonth:ml?left/ml:0,done:target>0&&saved>=target};
}
const GOAL_ICONS=[["target","Alvo"],["casa","Casa"],["transporte","Carro / moto"],["ticket","Viagem / lazer"],["wallet","Reserva"],["pessoal","Pessoal"],["pets","Pets"],["trabalho","Estudo / trabalho"]];
const GOAL_GRADS=[["#4A26E8","#B27DFF"],["#0EA5E9","#7DD3FC"],["#10B981","#6EE7B7"],["#EC4899","#F9A8D4"],["#F59E0B","#FDE047"],["#14B8A6","#5EEAD4"]];
function goalForm(g){const isNew=!g;g=g||{name:"",target:0,deadline:addM(TODAY_M,11),shared:true,icon:"target"};
  openForm({title:isNew?"Nova meta":"Editar meta",submit:isNew?"Criar meta":"Salvar",
    fields:[{id:"name",label:"Para quê?",value:g.name,req:true,ph:"Ex.: Viagem de fim de ano"},{type:"row",items:[{id:"target",label:"Quanto precisa",type:"money",value:g.target},{id:"deadline",label:"Até quando",type:"month",value:g.deadline||""}]},
      {id:"shared",label:"De quem é a meta",type:"select",value:g.shared?"1":"0",options:[["1","Do casal (os dois guardam juntos)"],["0","Só minha"]]},{id:"icon",label:"Ícone",type:"select",value:g.icon,options:GOAL_ICONS}],
    danger:isNew?null:{label:"Excluir",onClick:()=>{const u=withUndo("Meta excluída");S.goals=S.goals.filter(x=>x!==g);u()}},
    onSubmit:v=>{const o={name:v.name.trim(),target:parseMoney(v.target),deadline:/^\d{4}-\d{2}$/.test(v.deadline)?v.deadline:"",shared:v.shared==="1",icon:v.icon};
      if(!o.target){toast("Diga quanto precisa juntar.");return false}
      if(isNew)S.goals.push({id:uid("m"),...o,owner:whoAmI(),history:[]});else Object.assign(g,o)}});
}
function goalDepForm(g,withdraw){
  openForm({title:(withdraw?"Tirar de “":"Guardar em “")+g.name+"”",submit:withdraw?"Tirar":"Guardar",
    fields:[{type:"row",items:[{id:"value",label:"Valor",type:"money",value:0,req:true},{id:"date",label:"Data",type:"date",value:TODAY_D}]},{id:"note",label:"Observação (opcional)",value:"",ph:withdraw?"Ex.: usei parte na passagem":"Ex.: sobra do salário"}],
    onSubmit:v=>{const val=parseMoney(v.value);if(!val){toast("Informe um valor.");return false}
      g.history=g.history||[];g.history.push({id:uid("h"),date:v.date||TODAY_D,value:withdraw?-Math.abs(val):Math.abs(val),by:whoAmI(),note:v.note.trim()});
      const x=goalInfo(g);setTimeout(()=>toast(x.done?say("goal_done",{g:g.name},g.id+Date.now()):(withdraw?"Retirada anotada":say("goal_saved",{v:brl(x.left)},g.id+Date.now()))),0)}});
}
function goalCard(g,i){
  const x=goalInfo(g);const gr=GOAL_GRADS[i%GOAL_GRADS.length];const hist=(g.history||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  const by={};(g.history||[]).forEach(h=>{by[h.by||"—"]=(by[h.by||"—"]||0)+(+h.value||0)});const people=Object.entries(by).filter(e=>e[1]);
  return `<div class="card goal ${x.done?"done":""}"><div class="goal-h"><span class="cico lg" style="background:linear-gradient(135deg,${gr[0]},${gr[1]})">${ic(g.icon||"target")}</span>
    <div style="min-width:0;flex:1"><b class="goal-n">${esc(g.name)}</b><div class="goal-s">${g.shared?'<span class="pill plain idle">Do casal</span>':'<span class="pill plain idle">Só minha</span>'}${g.deadline?`<span>até ${mShort(g.deadline)}</span>`:""}</div></div>
    ${readOnly?"":`<button class="iconbtn sm" data-act="goal-edit" data-id="${g.id}" aria-label="Editar meta ${esc(g.name)}">${ic("edit")}</button>`}</div>
    <div class="goal-v"><b class="num">${brl(x.saved)}</b><span class="muted num">de ${brl(x.target)}</span></div>
    <div class="prog" style="height:10px"><i style="width:${x.pct*100}%;background:linear-gradient(90deg,${gr[0]},${gr[1]})"></i></div>
    <div class="goal-f">${x.done?`<span class="pos" style="font-weight:800">Meta concluída</span>`:`<span>${pct(x.pct)} · faltam <b class="num">${brl(x.left)}</b></span>${x.monthsLeft?`<span class="num">${brl(x.perMonth)}/mês</span>`:""}`}</div>
    ${people.length>1?`<div class="goal-people">${people.map(([n,v])=>`<span><i>${esc(String(n).charAt(0).toUpperCase())}</i>${esc(n)} <b class="num">${brl(v)}</b></span>`).join("")}</div>`:""}
    ${hist.length?`<div class="goal-hist">${hist.slice(0,3).map(h=>`<div><span>${fmtDate(h.date).slice(0,5)} · ${esc(h.by||"")}${h.note?" · "+esc(h.note):""}</span><b class="num ${h.value<0?"neg":"pos"}">${h.value>0?"+":""}${brl(h.value)}</b></div>`).join("")}</div>`:""}
    ${readOnly?"":`<div class="goal-a"><button class="btn sm primary" data-act="goal-dep" data-id="${g.id}">${ic("plus")}Guardar</button><button class="btn sm ghost" data-act="goal-wd" data-id="${g.id}">Tirar</button></div>`}</div>`;
}

/* ================= desafios ================= */
const dateAdd=(d,n)=>{const t=new Date(d+"T12:00:00");t.setDate(t.getDate()+n);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")};
const dateDiff=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);
function chMatch(c,i){if(c.match==="__all")return true;if(c.match.startsWith("cat:"))return i.cat===c.match.slice(4);return noAcc(gKind(i)||"")===noAcc(c.match)}
function chState(c){
  const end=dateAdd(c.start,c.days-1);
  const its=gAllItems().filter(i=>i.date>=c.start&&i.date<=end&&(!c.startTs||i.date>c.start||(i.ts||0)>=c.startTs)&&chMatch(c,i));
  const spent=Math.round(its.reduce((t,i)=>t+i.amount,0)*100)/100;
  const day=Math.min(c.days,Math.max(1,dateDiff(c.start,TODAY_D)+1));
  let st="active";if(c.quit)st="quit";else if(c.limit?spent>c.limit:its.length>0)st="failed";else if(TODAY_D>end)st="won";
  return {st,spent,n:its.length,day,end,left:Math.max(0,dateDiff(TODAY_D,end))};
}
function chLabel(c){return c.match==="__all"?"gastos invisíveis":c.match.startsWith("cat:")?gcat(c.match.slice(4)).name.toLowerCase():c.match.toLowerCase()}
function chSuggestions(){
  const since=dateAdd(TODAY_D,-30);const its=gAllItems().filter(i=>i.date>=since);
  const active=new Set((S.challenges||[]).filter(c=>chState(c).st==="active").map(c=>c.match));
  const by={};its.forEach(i=>{const k=gKind(i);if(!k)return;(by[k]=by[k]||{n:0,v:0});by[k].n++;by[k].v+=i.amount});
  const out=[];
  Object.entries(by).filter(e=>e[1].n>=2).sort((a,b)=>b[1].v-a[1].v).slice(0,3).forEach(([k,x])=>{if(active.has(k))return;
    out.push({title:"7 dias sem "+k.toLowerCase(),match:k,limit:0,days:7,why:`Você foi ${x.n} vezes nos últimos 30 dias (${brl(x.v)}).`})});
  const tot=its.reduce((t,i)=>t+i.amount,0);
  if(!active.has("__all")){const wk=tot?Math.max(20,Math.round(tot/30*7*0.7/10)*10):100;out.push({title:`Semana com até ${brl(wk)} em gastos invisíveis`,match:"__all",limit:wk,days:7,why:tot?`Hoje sua semana média é de ${brl(tot/30*7)}. Bora cortar 30%?`:"Um teto curto para começar o hábito."})}
  if(!active.has("Delivery")&&!out.some(o=>o.match==="Delivery"))out.push({title:"7 dias sem delivery",match:"Delivery",limit:0,days:7,why:"Cozinhar em casa uma semana inteira. O fantasma vai vigiar."});
  return out;
}
function chDot(x,k){if(x.st==="won")return "on";if(k<x.day-1)return "on";if(k===x.day-1)return x.st==="failed"?"x":x.st==="active"?"today":"";return ""}
function chMini(c,x){
  return `<div class="ch-mini"><div class="ch-mini-h"><b>${esc(c.title)}</b><span class="pill ${x.st==="won"?"ok":x.st==="failed"?"bad":x.st==="quit"?"idle":"warn"} plain">${x.st==="won"?"Concluído":x.st==="failed"?"Não rolou":x.st==="quit"?"Desistiu":"Dia "+x.day+" de "+c.days}</span></div>
    <div class="ch-days">${Array.from({length:c.days},(_,k)=>`<i class="${chDot(x,k)}"></i>`).join("")}</div>
    <small class="muted">${c.limit?`${brl(x.spent)} de ${brl(c.limit)} em ${esc(chLabel(c))}`:x.n?`${x.n} gasto(s) em ${esc(chLabel(c))} no período`:`Nenhum gasto em ${esc(chLabel(c))} até agora`}${x.st==="active"&&x.left?` · faltam ${x.left} dia(s)`:""}</small></div>`;
}
function chForm(){
  const kinds=[...new Set(KINDS.map(k=>k.name))];
  openForm({title:"Novo desafio",submit:"Começar hoje",fields:[{id:"match",label:"Desafio com",type:"select",value:"Delivery",options:[["__all","Todos os gastos invisíveis"],...kinds.map(k=>[k,k]),...GCATS.filter(c=>c.id!=="outros").map(c=>["cat:"+c.id,"Categoria: "+c.name])]},
    {type:"row",items:[{id:"days",label:"Quantos dias",type:"number",value:7},{id:"limit",label:"Gastar no máximo (0 = nada)",type:"money",value:0}]}],
    onSubmit:v=>{const days=Math.max(1,Math.min(90,parseInt(v.days)||7));const limit=parseMoney(v.limit);const c={id:uid("d"),match:v.match,days,limit,start:TODAY_D,startTs:Date.now()};
      c.title=limit?`${days} dias com até ${brl(limit)} em ${chLabel(c)}`:`${days} dias sem ${chLabel(c)}`;S.challenges.push(c)}});
}

/* ================= tela metas e desafios ================= */
function viewGoals(){
  const goals=S.goals||[];const ch=(S.challenges||[]).map(c=>({c,x:chState(c)}));const act=ch.filter(r=>r.x.st==="active");const past=ch.filter(r=>r.x.st!=="active").slice().reverse();
  const sugs=chSuggestions();const tot=goals.reduce((t,g)=>t+goalInfo(g).saved,0);
  return `<div class="grid" style="gap:20px">
  <div class="pagehead"><div><h1>Metas e desafios</h1><p>Junte dinheiro para o que importa · desafios usam o que você anota nos gastos invisíveis</p></div>${readOnly?"":`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="ch-new">${ic("ghost")}Desafio</button><button class="btn sm primary" data-act="goal-add">${ic("plus")}Nova meta</button></div>`}</div>
  <section class="mkpis" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
    ${kpi({cls:"hero",t:"Guardado nas metas",s:goals.length+" meta(s)",ico:"target",v:brl(tot)})}
    ${kpi({t:"Meta de guardar por mês",s:"Aparece no início",ico:"wallet",v:S.saveGoal?brl(S.saveGoal):"–",foot:readOnly?"":`<button data-act="set-save-goal" style="color:inherit;display:flex;justify-content:space-between;width:100%;align-items:center;gap:8px"><span>${S.saveGoal?"Ajustar":"Definir"}</span>${ic("arrow")}</button>`})}
    ${kpi({t:"Desafios",s:act.length?"Em andamento":"Nenhum ativo",ico:"ghost",v:String(act.length),extra:`<div class="s">${ch.filter(r=>r.x.st==="won").length} concluído(s)</div>`})}
  </section>
  <section class="goal-grid">${goals.length?goals.map((g,i)=>goalCard(g,i)).join(""):`<div class="card" style="grid-column:1/-1"><div class="empty" style="padding:40px 20px"><b>Nenhuma meta ainda</b>Viagem, reserva de emergência, entrada da casa. Crie uma meta e guardem juntos.${readOnly?"":`<div style="margin-top:14px"><button class="btn sm primary" data-act="goal-add">${ic("plus")}Criar primeira meta</button></div>`}</div></div>`}</section>
  <section class="row2 even">
    <div class="card"><div class="card-h"><span class="ghost-av lg">${ic("ghost")}</span><div><h2>Desafios em andamento</h2><div class="sub">O fantasma confere pelo que você anota no chat</div></div></div>
      <div class="card-b">${act.length?act.map(r=>`<div class="ch-row">${chMini(r.c,r.x)}${readOnly?"":`<button class="btn sm ghost" data-act="ch-quit" data-id="${r.c.id}">Desistir</button>`}</div>`).join(""):`<div class="empty"><b>Nenhum desafio ativo</b>Escolha uma das sugestões do fantasma ou crie o seu.</div>`}
      ${past.length?`<div class="ch-past"><b class="muted" style="font-size:12px">Anteriores</b>${past.slice(0,5).map(r=>`<div class="ch-row">${chMini(r.c,r.x)}${readOnly?"":`<button class="iconbtn sm" data-act="ch-del" data-id="${r.c.id}" aria-label="Apagar desafio">${ic("trash")}</button>`}</div>`).join("")}</div>`:""}</div></div>
    <div class="card"><div class="card-h"><div><h2>Sugestões do fantasma</h2><div class="sub">Baseadas nos seus últimos 30 dias</div></div></div>
      <div class="card-b" style="display:flex;flex-direction:column;gap:10px">${sugs.map((s,i)=>`<div class="ch-sug">${gAv()}<div style="flex:1;min-width:0"><b>${esc(s.title)}</b><small>${esc(s.why)}</small></div>${readOnly?"":`<button class="btn sm primary" data-act="ch-accept" data-i="${i}">Topar</button>`}</div>`).join("")}</div></div>
  </section></div>`;
}

/* ================= privacidade ================= */
function privOn(){return document.documentElement.classList.contains("privacy")}
function setPriv(on){document.documentElement.classList.toggle("privacy",on);lsSet("fin-priv",on?"1":"0");const b=$("#priv-btn");if(b){b.innerHTML=ic(on?"eyeoff":"eye");b.title=on?"Mostrar valores":"Esconder valores";b.setAttribute("aria-pressed",String(on))}}

Object.assign(handlers,{
  "go-ghost"(){location.hash="invisiveis"},
  "pay-in"(el){const m=S.months.find(x=>x.id===el.dataset.month);if(!m)return;const e=m.expenses.find(x=>x.id===el.dataset.id);if(!e)return;e.paid=e.planned;commit();toast("“"+e.desc+"” marcada como paga")},
  "set-save-goal"(){openForm({title:"Meta de guardar por mês",submit:"Salvar meta",fields:[{id:"v",label:"Quanto vocês querem guardar todo mês",type:"money",value:S.saveGoal||0}],onSubmit:v=>{S.saveGoal=parseMoney(v.v)}})},
  "set-ghost-cap"(){openForm({title:"Teto dos gastos invisíveis",submit:"Salvar teto",fields:[{id:"v",label:"Quanto pode ir pro fantasma por mês (0 = sem teto)",type:"money",value:S.ghostCap||0}],onSubmit:v=>{S.ghostCap=parseMoney(v.v)}})},
  "org-home"(){openOrganizer()},
  "goal-add"(){goalForm()},
  "goal-edit"(el){const g=S.goals.find(x=>x.id===el.dataset.id);if(g)goalForm(g)},
  "goal-dep"(el){const g=S.goals.find(x=>x.id===el.dataset.id);if(g)goalDepForm(g,false)},
  "goal-wd"(el){const g=S.goals.find(x=>x.id===el.dataset.id);if(g)goalDepForm(g,true)},
  "ch-accept"(el){const s=chSuggestions()[+el.dataset.i];if(!s)return;S.challenges.push({id:uid("d"),title:s.title,match:s.match,limit:s.limit,days:s.days,start:TODAY_D,startTs:Date.now()});commit();toast(say("ch_accept",{},s.title))},
  "ch-new"(){chForm()},
  "ch-quit"(el){const c=S.challenges.find(x=>x.id===el.dataset.id);if(!c)return;const u=withUndo("Desafio encerrado");c.quit=true;u();commit()},
  "ch-del"(el){const u=withUndo("Desafio apagado");S.challenges=S.challenges.filter(x=>x.id!==el.dataset.id);u();commit()},
  priv(){setPriv(!privOn())}
});

document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;
  if(el.tagName==="INPUT")return;
  const h=handlers[el.dataset.act];if(h){ev.preventDefault();h(el)}
});
document.addEventListener("change",ev=>{
  const el=ev.target;if(!S)return;
  if(el.dataset.act==="toggle-closed"){handlers["toggle-closed"](el);return}
  const k=el.dataset.edit;if(!k)return;
  if(k==="planned"||k==="paid"){const e=curMonth().expenses.find(x=>x.id===el.dataset.id);e[k]=parseMoney(el.value)}
  else if(k==="received"){const i=curMonth().incomes.find(x=>x.id===el.dataset.inc);i.received=parseMoney(el.value)}
  else if(k==="inc-planned"){const i=curMonth().incomes.find(x=>x.id===el.dataset.inc);i.planned=parseMoney(el.value)}
  else if(k==="initial"){S.investments.holdings.find(h=>h.id===el.dataset.hold).initial=parseMoney(el.value)}
  else if(k==="asset"){S.assets.find(a=>a.id===el.dataset.asset).value=parseMoney(el.value)}
  else if(k==="catname"){const c=S.categories.find(x=>x.id===el.dataset.cat);c.name=el.value.trim()||c.name}
  else if(k==="ghost-cap"){S.ghostCap=parseMoney(el.value)}
  else if(k==="c1"||k==="c2"||k==="icon"){S.categories.find(x=>x.id===el.dataset.cat)[k]=el.value}
  commit();
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#fx-sheets").innerHTML)closeModal();
  if(ev.key==="Enter"&&ev.target.classList&&ev.target.classList.contains("cell-in"))ev.target.blur();
});
let qT;
document.addEventListener("submit",ev=>{if(ev.target.id==="g-form"){ev.preventDefault();const i=$("#g-in");if(i)gDraft=i.value;gSend();setTimeout(()=>{const n=$("#g-in");n&&n.focus()},0)}});
document.addEventListener("input",ev=>{if(ev.target.id==="g-in"){gDraft=ev.target.value;return}if(ev.target.id==="q"){fQuery=ev.target.value;clearTimeout(qT);qT=setTimeout(render,120)}});
function fabToggle(open){const m=$("#fab-menu"),b=$("#fab");if(!m)return;if(open===undefined)open=m.hidden;
  if(open){m.innerHTML=[["exp","Despesa","Conta ou compra (pode parcelar)","up","linear-gradient(135deg,#F43F5E,#FB7185)"],["inc","Receita","Salário, freela, entrada","down","var(--grad-pos)"],["inv","Guardar dinheiro","Aporte em investimento","invest","var(--grad)"]].reverse()
    .map(([v,t,sub,i,g])=>`<button data-act="quick" data-v="${v}"><span class="qi" style="background:${g}">${ic(i)}</span><span>${t}<small>${sub}</small></span></button>`).join("")}
  m.hidden=!open;$("#fab-dim").hidden=!open;b.setAttribute("aria-expanded",String(open));b.setAttribute("aria-label",open?"Fechar":"Adicionar")}
$("#fab").addEventListener("click",ev=>{ev.stopPropagation();fabToggle()});
document.addEventListener("click",ev=>{if(!$("#fab-menu").hidden&&!ev.target.closest("#fab-wrap"))fabToggle(false)},true);
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")fabToggle(false)});
window.addEventListener("hashchange",()=>{route=(location.hash||"#visao").slice(1);if(!NAV.some(n=>n[0]===route))route="visao";render();window.scrollTo({top:0})});

/* ================= theme ================= */
function isDark(){const t=document.documentElement.dataset.theme;if(t)return t==="dark";return matchMedia("(prefers-color-scheme: dark)").matches}
(function(){const t=lsGet("fin-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;if(lsGet("fin-priv")==="1")document.documentElement.classList.add("privacy")})();
$("#acct-btn").addEventListener("click",()=>accountMenu());
$("#theme-btn").addEventListener("click",()=>{const next=isDark()?"light":"dark";document.documentElement.dataset.theme=next;lsSet("fin-theme",next);render()});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>renderChrome());

if(!NAV.some(n=>n[0]===route))route="visao";
render();
boot();
})();
</script>
