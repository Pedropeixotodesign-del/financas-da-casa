<style>
/* Layout: sidebar + workspace on desktop, top bar + bottom tab bar on phone. Dark glass cards, violet gradient as the single accent. */
:root{
  --bg:#F2F2F6; --bg-glow:rgba(124,77,255,.10);
  --surface:#FFFFFF; --surface-2:#F6F6F9; --surface-3:#ECECF2;
  --card-top:#FFFFFF; --card-bot:#FAFAFC;
  --line:rgba(16,16,28,.08); --line-strong:rgba(16,16,28,.14);
  --fg:#101018; --fg-2:#3A3A48; --muted:#747484;
  --grad:linear-gradient(135deg,#4A26E8 0%,#7646FF 48%,#B27DFF 100%);
  --grad-soft:linear-gradient(135deg,rgba(74,38,232,.12),rgba(178,125,255,.12));
  --grad-pos:linear-gradient(135deg,#0E9F6E 0%,#34D399 100%);
  --accent:#6A3CFF; --accent-fg:#FFFFFF; --accent-ink:#5A2EF0;
  --pos:#0F9F5A; --pos-bg:rgba(15,159,90,.10);
  --neg:#DC2F55; --neg-bg:rgba(220,47,85,.10);
  --warn:#C27A06; --warn-bg:rgba(194,122,6,.12);
  --bar-muted-top:#D9D9E3; --bar-muted-bot:#ECECF2;
  --shadow:0 1px 2px rgba(16,16,28,.04),0 8px 24px rgba(16,16,28,.06);
  --overlay:rgba(12,12,20,.45);
  --tab-bg:#FFFFFF;
  --f-ui:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#09090C; --bg-glow:rgba(124,77,255,.13);
  --surface:#131318; --surface-2:#1A1A21; --surface-3:#24242D;
  --card-top:#1A1A21; --card-bot:#121217;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --fg:#F3F3F7; --fg-2:#C9C9D4; --muted:#8C8C9C;
  --grad-soft:linear-gradient(135deg,rgba(118,70,255,.22),rgba(178,125,255,.12));
  --accent:#8B63FF; --accent-ink:#B79CFF;
  --pos:#3DDC97; --pos-bg:rgba(61,220,151,.12);
  --neg:#FF6B8B; --neg-bg:rgba(255,107,139,.13);
  --warn:#FBBF4A; --warn-bg:rgba(251,191,74,.13);
  --bar-muted-top:#3A3A46; --bar-muted-bot:#1D1D24;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.6);
  --tab-bg:#131318;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09090C; --bg-glow:rgba(124,77,255,.13);
  --surface:#131318; --surface-2:#1A1A21; --surface-3:#24242D;
  --card-top:#1A1A21; --card-bot:#121217;
  --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.13);
  --fg:#F3F3F7; --fg-2:#C9C9D4; --muted:#8C8C9C;
  --grad-soft:linear-gradient(135deg,rgba(118,70,255,.22),rgba(178,125,255,.12));
  --accent:#8B63FF; --accent-ink:#B79CFF;
  --pos:#3DDC97; --pos-bg:rgba(61,220,151,.12);
  --neg:#FF6B8B; --neg-bg:rgba(255,107,139,.13);
  --warn:#FBBF4A; --warn-bg:rgba(251,191,74,.13);
  --bar-muted-top:#3A3A46; --bar-muted-bot:#1D1D24;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.6);
  --tab-bg:#131318;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 500px at 0% -10%,var(--bg-glow),transparent 60%);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.02em}
.muted{color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 55%,transparent);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(106,60,255,.35)}
.logo svg{width:18px;height:18px}

.brand b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:500}
.navlabel{font-size:11.5px;font-weight:700;letter-spacing:.01em;color:var(--muted);padding:0 12px;margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--fg-2);text-decoration:none;font-weight:600;font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--surface-3);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.nav a[aria-current="page"] svg{color:var(--accent-ink)}
.nav .badge{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;background:var(--surface-3);border-radius:99px;padding:2px 7px;color:var(--muted)}
.side-card{margin-top:auto;border-radius:var(--r-lg);padding:16px;background:var(--grad);color:#fff;position:relative;overflow:hidden}
.side-card::after{content:"";position:absolute;inset:-40% -30% auto auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 65%)}
.side-card .mono{opacity:.85;font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:0}
.side-card b{display:block;font-size:22px;font-weight:800;margin:4px 0 10px;letter-spacing:-.02em}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:inherit}
.side-card p{margin:8px 0 0;font-size:12px;opacity:.9}

.main{min-width:0;padding-inline:28px;padding-block:22px 48px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top .crumbs{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.top .crumbs b{color:var(--fg)}
.top .spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:7px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.sync[data-s="saving"] i{background:var(--warn)}
.sync[data-s="local"] i,.sync[data-s="ro"] i{background:var(--muted)}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg-2);transition:background .15s}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:12px;font-weight:700;font-size:13px;background:var(--surface);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 20px rgba(106,60,255,.32)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.danger{color:var(--neg)}

.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.pagehead h1{font-size:28px;font-weight:800;line-height:1.1}
.hello h1{font-size:clamp(32px,4.2vw,46px);font-weight:800;line-height:1.05;letter-spacing:-.035em}
.hello p{margin:8px 0 0;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:-.005em}
.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- cards ---------- */
.card{background:linear-gradient(180deg,var(--card-top),var(--card-bot));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0;flex-wrap:wrap}
.card-h h2{font-size:15.5px;font-weight:800}
.card-h .sub{color:var(--muted);font-size:12.5px}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card-b{padding:16px 18px 18px}

.grid{display:grid;gap:16px}
.kpis{display:grid;gap:16px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto}
.kpis .hero{grid-row:span 2}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.kpi .lbl{display:flex;align-items:center;gap:10px}
.kpi .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface-3);color:var(--fg)}
.kpi .t{font-weight:700;font-size:13.5px}
.kpi .s{color:var(--muted);font-size:12px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.03em;margin-top:6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.kpi .foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--pos);background:var(--pos-bg)}
.pill.bad{color:var(--neg);background:var(--neg-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.idle{color:var(--muted);background:var(--surface-3)}
.pill.plain::before{display:none}

.hero{background:var(--grad);color:#fff;border:0;box-shadow:0 18px 40px -12px rgba(98,52,255,.55);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 90% -10%,rgba(255,255,255,.38),transparent 60%),radial-gradient(300px 200px at -10% 120%,rgba(20,0,90,.35),transparent 60%);z-index:-1}
.hero .ico{background:rgba(255,255,255,.95);color:#4A26E8}
.hero .s,.hero .foot{color:rgba(255,255,255,.82)}
.hero .v{font-size:40px;margin-top:auto}
.hero .foot{border-top-color:rgba(255,255,255,.22)}
.hero .chip{background:rgba(255,255,255,.95);color:#2a1780;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:800}
.hero .mini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.hero .mini div{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 10px;min-width:0}
.hero .mini span{display:block;font-size:11.5px;font-weight:600;opacity:.82}
.hero .mini b{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}

.row2{display:grid;gap:16px;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);align-items:start}
.row2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.ghost{display:grid;gap:16px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}
.chat{display:flex;flex-direction:column;position:sticky;top:16px}
.chat .card-h{padding-bottom:14px;border-bottom:1px solid var(--line)}
.msgs{height:min(62vh,600px);overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg.me{justify-content:flex-end}
.msg .bub{max-width:min(420px,86%);padding:10px 13px;border-radius:18px;font-size:13.5px;line-height:1.45;min-width:0}
.msg.me .bub{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.msg.bot .bub{background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px;width:min(420px,86%)}
.msg .tm{display:block;font-size:10.5px;opacity:.75;margin-top:4px;text-align:right;font-family:var(--f-mono)}
.gh{font-weight:800;font-size:12.5px;margin-bottom:6px}
.gitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0}
.gitem b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem small{display:block;font-size:11px;color:var(--muted)}
.gitem .acts button{width:26px;height:26px}
.ghost-av{width:28px;height:28px;border-radius:10px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.ghost-av svg{width:16px;height:16px}
.ghost-av.lg{width:36px;height:36px;border-radius:12px}
.ghost-logo{width:40px;height:40px;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(98,52,255,.7)}
.ghost-logo svg{width:22px;height:22px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.composer{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;height:44px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 14px;font-size:15px}
.composer input:focus{outline:0;border-color:var(--accent)}
.composer .btn{height:44px;width:48px;justify-content:center;padding:0;border-radius:14px;flex:none}
.composer .btn.mic{width:44px;color:var(--accent-ink)}
.gfoot{font-size:11.5px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line-strong)}
.hint{margin:0;padding:0 16px 14px;font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.hint svg{width:14px;height:14px;margin-top:1px}
.mnav{display:flex;align-items:center;gap:10px}
.mnav b{min-width:130px;text-align:center;font-weight:800}
.rank{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--grad-soft);color:var(--accent-ink);font-weight:800;font-size:12px;font-family:var(--f-mono)}
.thinking{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);margin-bottom:6px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s;margin-right:4px}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.linkbtn{color:var(--accent-ink);font-weight:700;text-decoration:underline}
.bud td{padding:10px 8px}.bud .cell-in{width:88px}.bud .desc{min-width:150px}
.bud{display:grid;gap:16px;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.cbadge{width:24px;height:24px;border-radius:8px;display:inline-grid;place-items:center;color:#fff;flex:none}
.cbadge svg{width:13px;height:13px;stroke-width:2.1}
.cbadge.xs{width:18px;height:18px;border-radius:6px}
.cbadge.xs svg{width:11px;height:11px}
.inc{display:flex;flex-direction:column;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.inc:last-child{border-bottom:0}
.inc-h{display:flex;align-items:center;gap:11px}
.inc-h .t{font-weight:700}.inc-h .s{font-size:11.5px;color:var(--muted)}
.inc-v{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-left:47px}
.inc-v label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.inc-v .cell-in{width:100%}
.rec-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.rec-sum div{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.rec-sum span{display:block;font-size:11.5px;font-weight:600;color:var(--muted)}
.rec-sum b{display:block;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog.pos i{background:var(--grad-pos)}
.side-seg{width:100%}.side-seg button{flex:1;padding:9px 8px}

/* segmented */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* charts */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:var(--shadow);min-width:170px;transform:translate(-50%,-100%);opacity:0;transition:opacity .12s;z-index:3}
.tip.on{opacity:1}
.tip b{display:block;font-size:12.5px;margin-bottom:6px}
.tip div{display:flex;justify-content:space-between;gap:14px;color:var(--muted)}
.tip div span:last-child{color:var(--fg);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.donut-wrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:center}
.donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut-center b{font-size:17px;font-weight:800}
.donut-center span{font-size:11px;color:var(--muted)}
.catlist{display:flex;flex-direction:column;gap:9px;min-width:0}
.catrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.catrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.catrow .bar{grid-column:2/4;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:-4px}
.catrow .bar i{display:block;height:100%;border-radius:inherit}
.dot{width:10px;height:10px;border-radius:4px;flex:none}
.cico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.cico svg{width:17px;height:17px}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;letter-spacing:0;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
th:first-child{border-radius:10px 0 0 10px} th:last-child{border-radius:0 10px 10px 0}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
@media (max-width:900px){.sticky1 td:first-child,.sticky1 th:first-child{position:sticky;left:0;z-index:1}.sticky1 td:first-child{background:var(--card-bot)}}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--surface-2)}
tfoot td{font-weight:800;border-top:1px solid var(--line-strong);border-bottom:0}
.minibar{display:inline-block;width:70px;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;vertical-align:middle;margin-left:8px}
.minibar i{display:block;height:100%;background:var(--grad);border-radius:inherit}

/* month tabs */
.mtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:112px;text-align:left}
.mtab b{font-size:13.5px;font-weight:800}
.mtab span{font-size:11.5px;color:var(--muted)}
.mtab[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(98,52,255,.6)}
.mtab[aria-pressed="true"] span{color:rgba(255,255,255,.85)}
.mtab.add{align-items:center;justify-content:center;flex-direction:row;gap:6px;color:var(--muted);border-style:dashed;min-width:auto;font-weight:700}

.mkpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.mkpis .kpi .v{font-size:21px}
.prog{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;border-radius:inherit;background:var(--grad)}

/* switch */
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:700;font-size:13px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:40px;height:23px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-strong);position:relative;transition:background .2s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + .tr{background:var(--grad);border-color:transparent}
.switch input:checked + .tr::after{transform:translateX(17px)}
.switch input:focus-visible + .tr{outline:2px solid var(--accent);outline-offset:2px}

/* expense list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);min-width:0;flex:1 1 160px;max-width:240px}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--fg);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chipf{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:700;color:var(--fg-2)}
.chipf[aria-pressed="true"]{border-color:transparent;background:var(--fg);color:var(--bg)}
.catchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--fg-2)}
.cell-in{width:96px;height:32px;border-radius:9px;border:1px solid transparent;background:var(--surface-2);padding:0 9px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cell-in:hover{border-color:var(--line-strong)}
.cell-in:focus{outline:0;border-color:var(--accent);background:var(--surface)}
.cell-in:disabled{background:transparent}
.desc{display:flex;align-items:center;gap:11px;min-width:180px}
.desc b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desc small{display:block;color:var(--muted);font-size:11.5px}
.acts{display:flex;gap:4px;justify-content:flex-end}
.acts button{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.acts button:hover{background:var(--surface-3);color:var(--fg)}
.acts button.check{color:var(--pos)}
.acts svg{width:16px;height:16px}

.mlist{display:none;flex-direction:column}
.mitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.mitem:last-child{border-bottom:0}
.mitem .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem .m{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mitem .amt{text-align:right}
.mitem .amt b{display:block;font-weight:800}
.mitem .amt small{font-size:11px;color:var(--muted)}

.empty{padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}

.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--fg-2)}
.tips li{display:flex;gap:10px}
.tips li span{font-family:var(--f-mono);font-size:11px;color:var(--accent-ink);background:var(--grad-soft);border-radius:6px;padding:1px 6px;height:fit-content}

.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-weight:700}
.li .s{font-size:11.5px;color:var(--muted)}

.debt-prog{display:flex;align-items:center;gap:8px}
.debt-prog .prog{width:90px;margin:0}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.catcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.catcard .top2{display:flex;align-items:center;gap:12px}
.catcard input[type=text]{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);padding:0 10px;font-weight:700}
.swatches{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.swatches input[type=color]{flex:none;width:34px;height:28px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:2px}
.gradbar{height:8px;border-radius:99px}

/* banner */
.banner{padding:12px 14px;border-radius:14px;background:var(--grad-soft);border:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}

/* modal */
.fx-sheet-bg{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fxFade .15s;overflow-y:auto;-webkit-overflow-scrolling:touch}
.fx-sheet{width:100%;max-width:460px;flex:0 1 460px;margin:auto;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.fx-sheet form{display:flex;flex-direction:column;gap:14px;padding:20px}
.menu-sheet{padding:18px;display:flex;flex-direction:column;gap:6px}
.menu-h{display:flex;align-items:center;gap:12px;padding:2px 4px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-h p{margin:2px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-av{width:42px;height:42px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:14px;text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item b{display:block;font-weight:700;font-size:14px}
.menu-item small{display:block;font-size:12px;color:var(--muted)}
.menu-ic{width:38px;height:38px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;flex:none}
.menu-item .chev{width:16px;height:16px;color:var(--muted)}
.menu-item.danger{color:var(--neg)}.menu-item.danger .menu-ic{background:var(--neg-bg);color:var(--neg)}
.fx-sheet h3{font-size:18px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);padding:0 12px;font-size:14px;width:100%}
.field input:focus,.field select:focus{outline:0;border-color:var(--accent)}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fx-sheet .acts2{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.fx-sheet .acts2 .btn.danger{margin-right:auto}
@keyframes fxFade{from{opacity:0}to{opacity:1}}

.fx-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:13px;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.fx-toast button{color:var(--accent-ink);font-weight:800;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--bg) 12%,transparent)}

/* bottom nav (phone) */
.fx-tabbar{display:none}
.fx-fabw{position:fixed;right:28px;bottom:28px;z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.fx-fab{display:grid;place-items:center;width:58px;height:58px;border-radius:19px;background:var(--grad);color:#fff;box-shadow:0 14px 32px -8px rgba(98,52,255,.7)}
.fx-fab svg{width:26px;height:26px;transition:transform .2s}
.fx-fab[aria-expanded="true"] svg{transform:rotate(45deg)}
.fx-fab:hover{filter:brightness(1.08)}
.fx-fabm{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fx-fabm button{display:flex;align-items:center;gap:11px;padding:7px 16px 7px 7px;border-radius:99px;background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);font-weight:800;font-size:14px;color:var(--fg);animation:fxUp .18s both}
.fx-fabm button:hover{background:var(--surface-2)}
.fx-fabm button:nth-child(2){animation-delay:.04s}.fx-fabm button:nth-child(3){animation-delay:.08s}
.fx-fabm .qi{width:36px;height:36px;border-radius:99px;display:grid;place-items:center;color:#fff}
.fx-fabm .qi svg{width:18px;height:18px}
#fab-dim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:44;background:rgba(8,8,14,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fxFade .15s}
.fx-fabm button>span:last-child{text-align:left}
.fx-fabm small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-align:left}
@keyframes fxUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- v2: início em blocos, metas, desafios, privacidade ---------- */
.hello-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.home-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.home-grid .hb{min-width:0}.home-grid .hb-full{grid-column:1/-1}
.home-grid .hb>section{height:100%}
.hbar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:10px}
.hbar i{display:block;height:100%;border-radius:inherit;background:#fff}
.prog.warn i{background:linear-gradient(90deg,#F59E0B,#FDE047)}
.prog.bad i{background:linear-gradient(90deg,#F43F5E,#FB7185)}
.goal-mini{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:7px}
.goal-mini:last-child{border-bottom:0}
.goal-mini-h{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;align-items:baseline}
.goal-mini-h b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal-mini-h .num{font-weight:700;white-space:nowrap;font-size:12.5px}
.ch-sug{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.ch-sug b{display:block;font-size:13.5px}.ch-sug small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ch-mini{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.ch-mini-h{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ch-mini-h b{font-size:13.5px;min-width:0}
.ch-mini small{font-size:12px}
.ch-days{display:flex;gap:4px}
.ch-days i{flex:1;height:8px;border-radius:99px;background:var(--surface-3)}
.ch-days i.on{background:var(--grad)}
.ch-days i.today{background:var(--grad);opacity:.45;outline:2px solid var(--accent);outline-offset:1px}
.ch-days i.x{background:var(--neg)}
.ch-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ch-row:last-child{border-bottom:0}
.ch-past{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line-strong);opacity:.85}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.goal{padding:18px;display:flex;flex-direction:column;gap:12px}
.goal.done{border-color:var(--pos)}
.goal-h{display:flex;gap:12px;align-items:center}
.cico.lg{width:44px;height:44px;border-radius:14px}
.goal-n{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-s{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px;flex-wrap:wrap}
.goal-v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.goal-v b{font-size:26px;letter-spacing:-.02em}
.goal-f{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.goal-f b{color:var(--fg)}
.goal-people{display:flex;gap:8px;flex-wrap:wrap}
.goal-people span{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px 4px 4px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.goal-people i{width:20px;height:20px;border-radius:50%;background:var(--grad);color:#fff;font-style:normal;font-weight:800;font-size:11px;display:grid;place-items:center}
.goal-hist{display:flex;flex-direction:column;gap:6px;font-size:12px;padding-top:10px;border-top:1px solid var(--line)}
.goal-hist div{display:flex;justify-content:space-between;gap:10px}
.goal-hist span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.goal-a{display:flex;gap:8px;margin-top:auto;align-items:center}
.iconbtn.sm{width:32px;height:32px;border-radius:10px}
.iconbtn:disabled{opacity:.35;cursor:default}
.org-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.org-it{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.org-it b{font-size:13.5px}
.org-it.off b{color:var(--muted);text-decoration:line-through}
.ghost-tr td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
html.privacy .num,html.privacy .kpi .v,html.privacy .cell-in,html.privacy .amt b,html.privacy .amt small,html.privacy .chart .axis,html.privacy .donut-center b,html.privacy .side-card b,html.privacy .tip .num,html.privacy .mtab span{filter:blur(7px);transition:filter .2s}
html.privacy .cell-in{pointer-events:none}
@media (max-width:900px){.home-grid{grid-template-columns:minmax(0,1fr)}.home-grid .hb-full{grid-column:auto}}
#fab-wrap[hidden],#fab-dim[hidden]{display:none!important}
.qrows{display:flex;flex-direction:column;gap:5px;margin:8px 0 6px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.qrows div{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.qrows span{color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrows b{white-space:nowrap;text-align:right}
.qtext{font-size:13.5px;margin-top:4px}
.gbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gbtns .chipf{font-size:12.5px}
.bub.recap{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.evo{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.evo-c{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;min-width:0}
.evo-c b{font-size:11px;white-space:nowrap}
.evo-b{flex:1;width:100%;max-width:34px;display:flex;align-items:flex-end;border-radius:9px;background:var(--surface-3);overflow:hidden}
.evo-b i{display:block;width:100%;border-radius:9px;background:linear-gradient(180deg,#B27DFF,#6A3CFF);opacity:.55}
.evo-c.on .evo-b i{opacity:1}
.evo-c small{font-size:11px;color:var(--muted)}

/* ---------- personagens ---------- */
.ghost-av.ch{overflow:hidden;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.ghost-av.ch .gart{width:100%;height:100%;display:block;transform:translateY(8%) scale(1.06)}
.ghost-pick{border-radius:12px;transition:transform .18s}
.ghost-pick:hover{transform:rotate(-6deg) scale(1.06)}
.gart{display:block}
.stage{position:relative;display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:28px;align-items:center;padding:28px;border-radius:28px;overflow:hidden;
  background:radial-gradient(420px 320px at 22% 50%,color-mix(in srgb,var(--ch) 30%,transparent),transparent 70%),linear-gradient(180deg,var(--card-top),var(--card-bot));border:1px solid var(--line);transition:background .4s}
.stage-art{position:relative;display:grid;place-items:center;min-height:280px}
.stage-art .spot{position:absolute;inset:auto 12% 6% 12%;height:26px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ch) 45%,transparent),transparent);filter:blur(2px);animation:shadowPulse 4.5s ease-in-out infinite}
.art-wrap{width:min(240px,70%);animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 18px 24px rgba(0,0,0,.18))}
.art-wrap .gart{width:100%;height:auto}
.locked-art{color:#120F1C;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--ch) 60%,transparent))}
.stage-art.enter .art-wrap{animation:ghostIn .62s cubic-bezier(.2,1.5,.35,1) both,floaty 4.5s ease-in-out .62s infinite}
.puffs{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.puffs i{position:absolute;width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--ch) 35%,var(--surface));animation:puff .6s ease-out both;transform:rotate(var(--a)) translateX(0)}
.stage-art.shake .art-wrap{animation:shake .5s both}
.stage-info{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage-name{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
.stage-name h2{font-size:clamp(34px,5vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1}
.stage-role{font-weight:700;color:var(--ch);font-size:15px;filter:saturate(1.2) brightness(var(--chb,1))}
.stage-from{margin:0;color:var(--muted);font-size:13px;font-weight:600}
.stage-story{margin:0;max-width:56ch;font-size:15px;line-height:1.55}
.stage-say{display:flex;gap:10px;align-items:flex-end}
.stage-av{width:42px;height:42px;border-radius:14px;overflow:hidden;flex:none}
.stage-av .gart{width:100%;height:100%;transform:translateY(8%) scale(1.06)}
.bubble{margin:0;padding:12px 15px;border-radius:18px 18px 18px 6px;background:var(--surface-2);border:1px solid var(--line);font-size:15px;font-weight:600;min-height:46px;max-width:52ch}
.bubble.typing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--fg);animation:blink .8s infinite}
.stage-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lockbox{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;background:var(--surface-2);border:1px dashed var(--line-strong);max-width:440px}
.lockbox span{color:var(--muted);font-size:13px}
.lockbar{height:10px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.lockbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#B8862B,#F2C14E)}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.cast-it{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .2s cubic-bezier(.2,1.4,.4,1),border-color .2s,box-shadow .2s}
.cast-it:hover{transform:translateY(-3px)}
.cast-it.on{border-color:var(--ch);box-shadow:0 0 0 3px color-mix(in srgb,var(--ch) 22%,transparent),0 12px 28px -12px color-mix(in srgb,var(--ch) 60%,transparent)}
.cast-av{width:52px;height:52px;border-radius:16px;overflow:hidden;flex:none;background:var(--chbg);transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.cast-it:hover .cast-av,.cast-it.on .cast-av{transform:rotate(-7deg) scale(1.06)}
.cast-av .gart{width:100%;height:100%;transform:translateY(8%) scale(1.06)}
.cast-it.lk .cast-av{background:#2B2340;color:#0B0912}
.cast-txt{min-width:0;display:flex;flex-direction:column}
.cast-txt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cast-txt small{color:var(--muted);font-size:12px}
.cast-cur{position:absolute;top:-8px;right:10px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--ch);color:#fff}
.cast-lock{margin-left:auto;color:var(--muted)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;top:62%;width:9px;height:14px;border-radius:2px;animation:confetti var(--d) cubic-bezier(.15,.8,.3,1) forwards}
.unlock-sheet{text-align:center;padding:26px 22px}
.unlock-sheet h3{font-size:24px;margin-top:6px}
.unlock-sheet p{color:var(--muted);margin:8px auto 0;max-width:36ch}
.unlock-sheet .ul-quote{color:var(--fg);font-weight:700}
.unlock-sheet .acts2{justify-content:center;margin-top:18px}
.ul-art{position:relative;width:150px;margin:0 auto;animation:ghostIn .8s cubic-bezier(.2,1.5,.35,1) both}
.ul-glow{position:absolute;inset:10% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(242,193,78,.55),transparent);filter:blur(10px);animation:shadowPulse 2.5s ease-in-out infinite}
.ul-art .gart{position:relative;width:100%;height:auto}
/* chat: resposta chega depois de "digitando" */
.msg{position:relative}
.msg.pop .bub{animation:popIn .32s cubic-bezier(.2,1.4,.4,1) both}
.msg.late .bub{animation:popIn .34s cubic-bezier(.2,1.4,.4,1) .6s both}
.msg.late2 .bub{animation-delay:1.1s}
.msg.late .ghost-av{animation:avBob .6s ease-in-out}
.typing-dots{position:absolute;left:40px;bottom:2px;display:flex;gap:4px;padding:10px 12px;border-radius:14px 14px 14px 4px;background:var(--surface-2);border:1px solid var(--line);animation:dotsOut .2s .55s forwards}
.msg.late2 .typing-dots{animation-delay:1.05s}
.typing-dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing-dots i:nth-child(2){animation-delay:.15s}.typing-dots i:nth-child(3){animation-delay:.3s}
.home-grid.intro .hbar i{animation:grow 1s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}

function clone(o){return JSON.parse(JSON.stringify(o))}
function normalize(s){
  s=clone(s||{});
  s.categories=s.categories||[];s.months=s.months||[];
  s.investments=s.investments||{holdings:[],contributions:[]};
  s.investments.holdings=s.investments.holdings||[];s.investments.contributions=s.investments.contributions||[];
  s.assets=s.assets||[];s.debts=s.debts||{base:TODAY_M,items:[]};s.debts.items=s.debts.items||[];
  s.months.sort((a,b)=>a.id<b.id?-1:1);
  s.months.forEach(m=>{m.expenses=m.expenses||[];m.incomes=m.incomes||[]});
  if(!s.categories.some(c=>c.id==="invisiveis"))s.categories.push({id:"invisiveis",name:"Gastos invisíveis",c1:"#7C3AED",c2:"#C4B5FD",icon:"ghost"});

  s.home=s.home||{order:[],hidden:[]};s.home.order=s.home.order||[];s.home.hidden=s.home.hidden||[];
  return s;
}
function commit(){
  if(readOnly){toast("Você só pode visualizar estes dados.");render();return}
  dirty=true;setSync("saving");
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,650);
  setTimeout(render,0);
}
async function flush(){
  if(saving){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300);return}
  if(!dirty)return;
  dirty=false;saving=true;
  const body=clone(S);
  try{
    if(mode==="db"&&store){await store.ref.set(body)}
    else{lsSet("fin-state",JSON.stringify(body))}
    setSync(mode==="db"?"ok":"local");
  }catch(e){
    if(e&&(e.code==="invalid_argument")){readOnly=true;setSync("ro");toast("Sem permissão para editar. Os dados estão em modo leitura.");render()}
    else if(e&&e.code==="unavailable"){dirty=true;setTimeout(flush,1500+Math.random()*1000)}
    else{setSync("err");toast("Não foi possível salvar agora. Tente de novo em instantes.")}
  }
  saving=false;
}
function setSync(s){
  const el=$("#sync");if(!el)return;
  const map={ok:"Sincronizado na nuvem",saving:"Salvando…",local:"Salvo neste navegador",ro:"Somente leitura",err:"Erro ao salvar",loading:"Carregando…"};
  el.dataset.s=s;el.querySelector("span").textContent=map[s]||s;
}
async function initStore(){
  let db=null;
  db=await getSbDb();
  if(db){
    try{
      const ref=db.doc("fin/state");store={ref};mode="db";setSync("ok");
      ref.onSnapshot(snap=>{
        loaded=true;
        if(dirty||saving)return;
        S=snap.exists?normalize(snap.data()):null;
        render();
      },err=>{ if(err&&err.code==="revoked"){readOnly=true;setSync("ro")} });
      return;
    }catch(e){}
  }
  mode="local";loaded=true;
  const raw=lsGet("fin-state");
  if(raw){try{S=normalize(JSON.parse(raw))}catch(e){S=null}}
  setSync("local");render();
}


/* ================= Supabase ================= */
const SB_URL="https://lkmgorzhkqzvkzrblzqr.supabase.co";
const SB_KEY="sb_publishable_E195rAqKqD6anua2IW82JQ_qiBm1Wn9";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let sbUser=null;
const sbListeners=[];let sbChannel=null;
function sbErr(e){const denied=e&&(e.code==="42501"||/row-level security|permission/i.test(e.message||""));return {code:denied?"invalid_argument":"unavailable",message:e&&e.message}}
function sbRealtime(){
  if(sbChannel)return;
  sbChannel=sb.channel("docs-sync").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const id=(p.new&&p.new.id)||(p.old&&p.old.id);sbListeners.forEach(l=>{if(!id||l.match(id))l.refresh()})}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sbListeners.forEach(l=>l.refresh())});
}
const sbDb={
  doc(path){return {
    async set(data){const {error}=await sb.from("docs").upsert({id:path,data});if(error)throw sbErr(error)},
    onSnapshot(next,onErr){const refresh=async()=>{const {data,error}=await sb.from("docs").select("data").eq("id",path).maybeSingle();if(error){console.warn(error);return}next({exists:!!data,data:()=>data?data.data:undefined})};sbListeners.push({match:id=>id===path,refresh});sbRealtime();refresh();return ()=>{}}
  }},
  collection(prefix){return {
    doc(id){return sbDb.doc(prefix+"/"+id)},
    onSnapshot(next,onErr){let prev=new Set();const refresh=async()=>{const {data,error}=await sb.from("docs").select("id,data").like("id",prefix+"/%");if(error){console.warn(error);return}
      const docs=data.map(r=>{const id=r.id.slice(prefix.length+1);return {id,exists:true,data:()=>r.data}});const ids=new Set(docs.map(d=>d.id));
      const changes=[...prev].filter(i=>!ids.has(i)).map(i=>({type:"removed",doc:{id:i}}));prev=ids;next({docs,docChanges:()=>changes})};
      sbListeners.push({match:id=>id.startsWith(prefix+"/"),refresh});sbRealtime();refresh();return ()=>{}}
  }}
};
async function getSbDb(){return sbUser?sbDb:null}

const catById=id=>(S.categories.find(c=>c.id===id))||{id:"outros",name:"Outros",c1:"#64748B",c2:"#CBD5E1",icon:"outros"};
const catGrad=c=>`linear-gradient(135deg,${c.c1},${c.c2})`;
const cbadge=(c,sz)=>`<span class="cbadge ${sz||""}" style="background:${catGrad(c)}" aria-hidden="true">${ic(c.icon)}</span>`;
function statusOf(e){const p=+e.planned||0,d=+e.paid||0;return d>=p?"Pago":d>0?"Parcial":"Pendente"}
function investedIn(mid){return S.investments.contributions.filter(c=>(c.date||"").slice(0,7)===mid).reduce((t,c)=>t+(+c.value||0),0)}
function months(){
  let prev=null;
  return S.months.map((m,i)=>{
    const ex=mExps(m);const ip=sum(m.incomes,"planned"),ir=sum(m.incomes,"received"),ep=sum(ex,"planned"),epd=sum(ex,"paid");
    const result=m.closed?ir-epd:ip-ep;
    const invested=investedIn(m.id);
    const opening=i===0?(+m.openingBalance||0):prev;
    const final=opening+result-invested;prev=final;
    return {m,id:m.id,ip,ir,ep,epd,result,invested,opening,final,paidPct:ep?epd/ep:0,recPct:ip?ir/ip:0};
  });
}
function holdings(){
  const H=S.investments.holdings.map(h=>{const ap=S.investments.contributions.filter(c=>c.holding===h.id).reduce((t,c)=>t+(+c.value||0),0);return {h,ap,total:(+h.initial||0)+ap}});
  const total=H.reduce((t,x)=>t+x.total,0);
  H.forEach(x=>x.pct=total?x.total/total:0);
  return {H,total,initial:sum(S.investments.holdings,"initial"),aportes:H.reduce((t,x)=>t+x.ap,0)};
}
function debts(){
  const base=S.debts.base||TODAY_M;const off=diffM(base,TODAY_M);
  const D=S.debts.items.map(d=>{const cur=Math.max(0,Math.min(d.total,d.currentAtBase+off));const rem=d.total-cur;return {d,cur,rem,bal:rem*d.installment,ends:addM(base,d.total-d.currentAtBase)}});
  const total=D.reduce((t,x)=>t+x.bal,0);
  const proj=[];let p0=null;
  for(let i=0;i<16;i++){
    const mid=addM(base,i);
    const parc=S.debts.items.reduce((t,d)=>t+((d.currentAtBase+i>=1&&d.currentAtBase+i<=d.total)?d.installment:0),0);
    const rest=S.debts.items.reduce((t,d)=>t+d.installment*Math.max(0,d.total-Math.max(0,d.currentAtBase+i)),0);
    if(p0===null)p0=parc;
    proj.push({mid,parc,rest,folga:p0-parc});
  }
  return {D,total,proj,base,monthly:sum(S.debts.items.filter((d,i)=>D[i].rem>0),"installment")};
}
function assets(){
  const inv=holdings().total;
  const A=S.assets.map(a=>({a,value:a.auto==="investments"?inv:(+a.value||0)}));
  return {A,total:A.reduce((t,x)=>t+x.value,0)};
}
function cashNow(M){
  if(!M.length)return {total:0,opening:0,month:0,cur:null,prev:null};
  let i=M.findIndex(x=>x.id===TODAY_M);
  if(i<0){i=-1;M.forEach((x,k)=>{if(x.id<TODAY_M)i=k});if(i<0)i=0}
  const x=M[i];
  return {total:x.final,opening:x.opening,month:x.result-x.invested,cur:x.id,prev:i>0?M[i-1].id:null,closed:x.m.closed};
}
function greet(){const h=new Date().getHours();return h<5?"Boa noite":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite"}
function summary(){
  const M=months();const inv=holdings();const dv=debts();const as=assets();
  return {M,acc:M.reduce((t,x)=>t+x.result,0),proj:M.length?M[M.length-1].final:0,projId:M.length?M[M.length-1].id:null,inv:inv.total,debt:dv.total,assets:as.total,nw:as.total-dv.total};
}
function catTotals(ids){
  const out={};S.categories.forEach(c=>out[c.id]=ids.map(()=>0));
  ids.forEach((mid,i)=>{const m=S.months.find(x=>x.id===mid);if(!m)return;mExps(m).forEach(e=>{if(!out[e.cat])out[e.cat]=ids.map(()=>0);out[e.cat][i]+=+e.planned||0})});
  return out;
}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p}
let tipData={};
function cashChart(M){
  if(!M.length)return '<div class="empty">Sem meses ainda.</div>';
  const narrow=window.innerWidth<640;const W=narrow?400:720,H=narrow?250:270,pl=46,pr=10,pt=14,pb=30;const iw=W-pl-pr,ih=H-pt-pb;
  const vals=M.flatMap(x=>[x.m.closed?x.ir:x.ip,x.m.closed?x.epd:x.ep]);
  const finals=M.map(x=>x.final);
  const hi=Math.max(...vals,...finals,1),lo=Math.min(0,...finals);const step=niceMax((hi-lo)/4);const top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;const nt=Math.round((top-bot)/step);
  const y=v=>pt+ih*(top-v)/(top-bot);
  const gw=iw/M.length,bw=Math.min(30,gw*0.28);
  let g="";
  for(let k=0;k<=nt;k++){const v=bot+step*k;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${brlK(v).replace("R$ ","")}</text>`}
  if(bot<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"/>`;
  let bars="",line="",dots="",hits="";tipData.cash={};
  M.forEach((x,i)=>{
    const cx=pl+gw*i+gw/2;const inc=x.m.closed?x.ir:x.ip,exp=x.m.closed?x.epd:x.ep;
    const cur=x.id===selMonthId();
    bars+=`<rect x="${cx-bw-3}" y="${y(inc)}" width="${bw}" height="${Math.max(0,y(0)-y(inc))}" rx="7" fill="url(#gInc)" opacity="${cur?1:.78}"/>`;
    bars+=`<rect x="${cx+3}" y="${y(exp)}" width="${bw}" height="${Math.max(0,y(0)-y(exp))}" rx="7" fill="url(#gExp)"/>`;
    bars+=`<text class="axis" x="${cx}" y="${H-10}" text-anchor="middle" style="${cur?"fill:var(--fg);font-weight:600":""}">${mShort(x.id)}</text>`;
    line+=(i?"L":"M")+cx+","+y(x.final);
    dots+=`<circle cx="${cx}" cy="${y(x.final)}" r="4.5" fill="var(--surface)" stroke="var(--pos)" stroke-width="2.2"/>`;
    hits+=`<rect data-tip="cash" data-i="${i}" x="${pl+gw*i}" y="${pt}" width="${gw}" height="${ih}" fill="transparent"/>`;
    tipData.cash[i]={x:cx/W,y:Math.min(y(inc),y(exp),y(x.final))/H,title:mLong(x.id)+(x.m.closed?" · encerrado":" · previsto"),rows:[["Receitas",brl(inc)],["Despesas",brl(exp)],["Resultado",brl(x.result)],["Saldo final",brl(x.final)]]};
  });
  return `<div class="chart" id="cash-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Renda, despesas e saldo final por mês">
  <defs><linearGradient id="gInc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B27DFF"/><stop offset=".5" stop-color="#7646FF"/><stop offset="1" stop-color="#4A26E8"/></linearGradient>
  <linearGradient id="gExp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bar-muted-top)"/><stop offset="1" stop-color="var(--bar-muted-bot)"/></linearGradient></defs>
  ${g}${bars}<path d="${line}" fill="none" stroke="var(--pos)" stroke-width="2.2" stroke-linejoin="round"/>${dots}${hits}</svg><div class="tip"></div></div>`;
}
function donut(items,centerTop,centerSub,size){
  size=size||170;const r=62,c=2*Math.PI*r;const total=items.reduce((t,x)=>t+x.v,0)||1;let off=0;let arcs="",defs="";
  items.filter(x=>x.v>0).forEach((x,i)=>{const len=c*x.v/total;const gap=items.length>1?2.5:0;
    defs+=`<linearGradient id="dg${i}${x.key}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${x.c1}"/><stop offset="1" stop-color="${x.c2}"/></linearGradient>`;
    arcs+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="url(#dg${i}${x.key})" stroke-width="18" stroke-dasharray="${Math.max(0,len-gap)} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)" stroke-linecap="butt"><title>${esc(x.name)}: ${brl(x.v)}</title></circle>`;off+=len});
  return `<div class="chart" style="width:${size}px;max-width:100%;aspect-ratio:1"><svg viewBox="0 0 160 160"><defs>${defs}</defs><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="18"/>${arcs}</svg><div class="donut-center"><b class="num">${centerTop}</b><span>${centerSub}</span></div></div>`;
}
function debtChart(proj){

  const step=niceMax(Math.max(...proj.map(p=>p.rest),1)/4);const top=Math.ceil(Math.max(...proj.map(p=>p.rest),1)/step)*step;const nt=Math.round(top/step);const n=proj.length;
  const x=i=>pl+iw*i/(n-1);const y=v=>pt+ih*(1-v/top);
  let g="",lab="",line="",dots="",hits="";tipData.debt={};
  for(let k=0;k<=nt;k++){const v=step*k;g+=`<line class="grid-l" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl-8}" y="${y(v)+3.5}" text-anchor="end">${brlK(v).replace("R$ ","")}</text>`}
  proj.forEach((p,i)=>{line+=(i?"L":"M")+x(i)+","+y(p.rest);if(i%(narrow?5:3)===0||i===n-1)lab+=`<text class="axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${mShort(p.mid)}</text>`;
    dots+=`<circle cx="${x(i)}" cy="${y(p.rest)}" r="${i===0?5:3}" fill="${i===0?"#fff":"var(--accent)"}" stroke="${i===0?"var(--accent)":"none"}" stroke-width="2.5"/>`;

  const area=line+`L${x(n-1)},${y(0)}L${x(0)},${y(0)}Z`;
  return `<div class="chart" id="debt-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projeção da dívida restante"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7646FF" stop-opacity=".45"/><stop offset="1" stop-color="#7646FF" stop-opacity="0"/></linearGradient><linearGradient id="gLine" x1="0" x2="1"><stop offset="0" stop-color="#4A26E8"/><stop offset="1" stop-color="#B27DFF"/></linearGradient></defs>${g}<path d="${area}" fill="url(#gArea)"/><path d="${line}" fill="none" stroke="url(#gLine)" stroke-width="3" stroke-linejoin="round"/>${dots}${lab}${hits}</svg><div class="tip"></div></div>`;
}
function bindTips(){
  document.querySelectorAll(".chart").forEach(ch=>{
    const tip=ch.querySelector(".tip");if(!tip)return;
    ch.addEventListener("pointermove",ev=>{const t=ev.target.closest("[data-tip]");if(!t){tip.classList.remove("on");return}

  // desafios

function openForm({title,fields,submit,onSubmit,danger,noCommit}){
  const root=$("#fx-sheets");
  const f=fields.map(fl=>{
    const id="mf-"+fl.id;
    if(fl.type==="select")return `<div class="field"><label for="${id}">${fl.label}</label><select id="${id}" name="${fl.id}">${fl.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===fl.value?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
    if(fl.type==="row")return `<div class="fields2">${fl.items.map(it=>`<div class="field"><label for="mf-${it.id}">${it.label}</label><input id="mf-${it.id}" name="${it.id}" ${it.type==="money"?'inputmode="decimal"':`type="${it.type||"text"}"`} value="${esc(it.type==="money"?moneyIn(it.value):it.value??"")}" ${it.req?"required":""}></div>`).join("")}</div>`;
    return `<div class="field"><label for="${id}">${fl.label}</label><input id="${id}" name="${fl.id}" ${fl.type==="money"?'inputmode="decimal"':`type="${fl.type||"text"}"`} value="${esc(fl.type==="money"?moneyIn(fl.value):fl.value??"")}" ${fl.req?"required":""} ${fl.ph?`placeholder="${esc(fl.ph)}"`:""}></div>`;
  }).join("");
  root.innerHTML=`<div class="fx-sheet-bg" data-close="1"><div class="fx-sheet" role="dialog" style="display:block;visibility:visible;opacity:1;position:relative;z-index:1" aria-modal="true" aria-labelledby="m-title"><form id="m-form" novalidate><h3 id="m-title">${title}</h3>${f}<div class="acts2">${danger?`<button type="button" class="btn danger" id="m-danger">${ic("trash")}${danger.label}</button>`:""}<button type="button" class="btn" data-close="1">Cancelar</button><button class="btn primary" type="submit">${submit||"Salvar"}</button></div></form></div></div>`;
  const form=$("#m-form");
  setTimeout(()=>{const el=form.querySelector("input,select");el&&el.focus()},30);
  form.addEventListener("submit",ev=>{ev.preventDefault();const vals={};new FormData(form).forEach((v,k)=>vals[k]=v);
    const bad=[...form.querySelectorAll("[required]")].find(i=>!String(i.value).trim());if(bad){bad.focus();bad.style.borderColor="var(--neg)";return}
    if(onSubmit(vals)!==false){closeModal();if(!noCommit)commit()}});
  if(danger)$("#m-danger").addEventListener("click",()=>{danger.onClick();closeModal();if(!noCommit)commit()});
  root.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",ev=>{if(ev.target===el)closeModal()}));
}

let toastT;
function toast(msg,undo){
  const r=$("#toast-root");r.innerHTML=`<div class="fx-toast" role="status"><span>${esc(msg)}</span>${undo?'<button id="undo">Desfazer</button>':""}</div>`;
  if(undo)$("#undo").onclick=()=>{const res=undo();r.innerHTML="";if(res!==false)commit()};
  clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML="",undo?6000:2800);
}

function kindOf(txt){const t=" "+noAcc(txt).replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ")+" ";for(const k of KINDS){for(const w of k.kw){if(t.includes(" "+w+" "))return k}}return null}
function gSig(place,kind){const kw=new Set(KINDS.flatMap(k=>k.kw));return noAcc(place).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=3&&!GSTOP.has(w)&&!kw.has(w)&&!/^\d+$/.test(w))}

function gMatchKnown(place,kind){
  const sig=gSig(place);if(!sig.length)return null;
  const known=gAllItems().slice().reverse();
  for(const it of known){if(!it.place||noAcc(it.place)===noAcc(place))continue;const ik=it.kind||(kindOf(it.place)||{}).name;
    if(kind&&ik&&kind!==ik)continue;const s2=gSig(it.place);if(sig.some(w=>s2.includes(w)))return {place:it.place,cat:it.cat,kind:ik||kind||null}}
  const same=known.find(it=>noAcc(it.place)===noAcc(place));if(same)return {place:same.place,cat:same.cat,kind:same.kind||kind||null};
  return null;

function gSmart(place,seg){

function gParseAmount(tok){

function gTitle(s){s=s.trim();return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function gParse(text){
  let src=text.replace(/(\d+)\s*reais?\s*e\s*(\d{1,2})\s*centavos?/gi,"$1,$2").replace(/(\d+)\s*contos?\s*e\s*(\d{1,2})/gi,"$1,$2");
  let dateOff=0;const n0=noAcc(src);
  if(/\banteontem\b/.test(n0))dateOff=-2;else if(/\bontem\b/.test(n0))dateOff=-1;
  const segs=src.split(/\n|;|\s+e\s+(?=[^\d]*\d)|,\s+|\s+\+\s+/i).map(s=>s.trim()).filter(Boolean);
  const items=[];
  const NUM=/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?!\d)/gi;
  segs.forEach(seg=>{
    const all=[...seg.matchAll(NUM)];if(!all.length){if(items.length&&!items[items.length-1].placeSet){const p=gPlace(seg);if(p){const sm=gSmart(p,seg);Object.assign(items[items.length-1],{place:sm.place,cat:sm.cat,kind:sm.kind})}}return}
    let pick=all.find(m=>/r\$/i.test(m[0]))||all.find(m=>/^\s*(reais|real|conto|contos|pila|pilas|rs)\b/i.test(seg.slice(m.index+m[0].length)))||all[all.length-1];
    const amount=gParseAmount(pick[1]);if(!amount)return;
    const rest=(seg.slice(0,pick.index)+" "+seg.slice(pick.index+pick[0].length)).replace(/\b(reais|real|contos?|pilas?|rs)\b/gi," ");
    const place=gPlace(rest)||"Sem descrição";

}
function gPlace(rest){

const GSTOP3=new Set(["da","do","das","dos","de","na","no","nas","nos","em","com","pra","pro","para","que","meu","minha","meus","minhas","nosso","nossa","conta","contas","fatura","boleto","parcela","mensalidade","dia","mes","valor","total","the"]);
function gTok(s){return noAcc(s).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=3&&!GSTOP3.has(w)&&!/^\d+$/.test(w))}
const gNorm=t=>" "+noAcc(t).replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim()+" ";
const gMoneyText=t=>t.replace(/(\d+(?:[.,]\d+)?)\s*mil\b/gi,(a,n)=>String(Math.round(parseFloat(n.replace(",","."))*1000))).replace(/(\d+(?:[.,]\d+)?)\s*k\b/gi,(a,n)=>String(Math.round(parseFloat(n.replace(",","."))*1000)));
const GNUM=/(?:r\$\s*)?(\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|\d+(?:[.,]\d{1,2})?)(?!\d)/i;
function gIntent(text){
  const raw=text.trim();const t=gNorm(raw);
  if(/\?/.test(raw))return "ask";
  if(/^ (quanto|quantos|quantas|qual|quais|onde|cade|como (estou|esta|estao|to|ta|vai|andam)|resumo|mostra|me mostra|me fala|me diz|ja gastei|sobrou|falta|faltam) /.test(t))return "ask";
  if(/ (recebi|recebemos|entrou|entraram|caiu|cairam|ganhei|ganhamos|pingou|depositaram|recebimento) /.test(t))return "income";

}
function gPost(date,text,extra){const mid=date.slice(0,7);const m={id:uid("m"),ts:Date.now(),date,text,items:[],...extra};gDoc(mid).msgs.push(m);gFresh={id:m.id,at:Date.now()};gDraft="";gMonth=mid;gScroll=true;gCommit(mid);return m}

/* receitas: “recebi 5000 do trabalho” */
function gIncome(text){
  if(!S||readOnly)return false;
  const {date}=gParse(text);const mid=date.slice(0,7);const tn=gMoneyText(text);const mm=GNUM.exec(tn);
  if(!mm){gPost(date,text,{kind:"inc",reply:{text:say("income_value",{},text)}});return true}
  const amount=gParseAmount(mm[1]);if(!amount)return false;
  let src=(tn.slice(0,mm.index)+" "+tn.slice(mm.index+mm[0].length)).replace(/\b(recebi|recebemos|entrou|entraram|caiu|cairam|ganhei|ganhamos|pingou|depositaram|recebimento|hoje|ontem|anteontem|reais|real|contos?|pila|agora|j[aá]|finalmente)\b/gi," ").replace(/\s+/g," ").trim();
  const pm=/(?:^|\s)(?:do|da|de|dos|das|pelo|pela|com|referente\s+a|ref\.?)\s+(.+)$/i.exec(src);
  let source=(pm?pm[1]:src).replace(/\b(o|a|os|as|meu|minha|meus|minhas|nosso|nossa)\b/gi," ").replace(/[.!]+$/,"").replace(/\s+/g," ").trim();
  source=gTitle(source.slice(0,40))||"Entrada";
  const m=S.months.find(x=>x.id===mid);
  if(!m){gPost(date,text,{kind:"inc",reply:{text:say("no_month",{m:mLong(mid)},text)}});return true}
  const toks=gTok(source);
  let inc=toks.length?m.incomes.find(i=>{const it=gTok(i.source);return toks.some(w=>it.some(x=>x.startsWith(w)||w.startsWith(x)))}):null;
  if(!inc)inc=m.incomes.find(i=>(+i.received||0)<(+i.planned||0)&&Math.abs((+i.planned||0)-amount)<0.01);
  let act;
  if(inc){act={t:"inc",month:mid,id:inc.id,created:false,prev:+inc.received||0};inc.received=Math.round(((+inc.received||0)+amount)*100)/100}
  else{const id=uid("i");m.incomes.push({id,source,planned:amount,received:amount});act={t:"inc",month:mid,id,created:true}}
  commit();
  const name=inc?inc.source:source;
  gPost(date,text,{kind:"inc",act,reply:{title:"Receita registrada",rows:[["Entrada",name],["Valor",brl(amount)],["Mês",mLong(mid)]],text:say("income",{v:brl(amount),m:mLong(mid),s:name},text)}});
  return true;
}

/* contas: “paguei a luz” */
function gPayApply(mid,e,amount){const prev=+e.paid||0;const was=statusOf(e)==="Pago"&&!amount;if(!was){e.paid=amount?Math.round(amount*100)/100:(+e.planned||0);commit()}return {act:was?null:{t:"pay",month:mid,id:e.id,prev},was}}
function gPayReply(mid,e,was){return {title:was?"Essa já estava paga":"Conta paga",rows:[["Conta",e.desc],["Pago",brl(e.paid)],["Mês",mLong(mid)]],text:say(was?"pay_already":"pay",{d:e.desc,m:mLong(mid)},e.id)}}
function gPay(text){
  if(!S||readOnly)return false;
  const {date}=gParse(text);const mid=date.slice(0,7);const m=S.months.find(x=>x.id===mid);
  const tn=gMoneyText(text);const mm=GNUM.exec(tn);const amount=mm?gParseAmount(mm[1]):null;
  const q=(mm?tn.slice(0,mm.index)+" "+tn.slice(mm.index+mm[0].length):tn).replace(/\b(paguei|pagamos|quitei|quitamos|pago|hoje|ontem|anteontem|j[aá]|reais|real)\b/gi," ");
  const toks=gTok(q);
  if(!m){if(amount)return false;gPost(date,text,{kind:"pay",reply:{text:say("no_month",{m:mLong(mid)},text)}});return true}
  if(!toks.length){if(amount)return false;gPost(date,text,{kind:"pay",reply:{text:say("pay_what",{},text)}});return true}
  const sc=m.expenses.map(e=>{const et=gTok(e.desc);return {e,s:toks.filter(w=>et.some(x=>x.startsWith(w)||w.startsWith(x))).length}}).filter(x=>x.s>0);
  if(!sc.length){if(amount)return false;gPost(date,text,{kind:"pay",reply:{text:say("pay_notfound",{q:gTitle(toks.join(" ")),m:mLong(mid)},text)}});return true}
  const top=Math.max(...sc.map(x=>x.s));let c=sc.filter(x=>x.s===top).map(x=>x.e);
  if(c.length>1){const pend=c.filter(e=>statusOf(e)!=="Pago");if(pend.length===1)c=pend}
  if(c.length>1){gPost(date,text,{kind:"pay",pick:{month:mid,amount,ids:c.slice(0,6).map(e=>e.id)},reply:{text:say("pay_multi",{},text)}});return true}
  const r=gPayApply(mid,c[0],amount);
  gPost(date,text,{kind:"pay",act:r.act,reply:gPayReply(mid,c[0],r.was)});
  return true;
}
function gUndoAct(a){const m=S.months.find(x=>x.id===a.month);if(!m)return;
  if(a.t==="inc"){if(a.created)m.incomes=m.incomes.filter(i=>i.id!==a.id);else{const i=m.incomes.find(i=>i.id===a.id);if(i)i.received=a.prev}}
  else if(a.t==="pay"){const e=m.expenses.find(e=>e.id===a.id);if(e)e.paid=a.prev}
  commit()}

function mPeriod(mid,label){const {y,m}=ym(mid);const last=new Date(y,m,0).getDate();const cur=mid===TODAY_M;const pm=addM(mid,-1);const p=ym(pm);const lastP=new Date(p.y,p.m,0).getDate();
  return {from:mid+"-01",to:cur?TODAY_D:mid+"-"+String(last).padStart(2,"0"),label,type:"month",mid,
    prev:{from:pm+"-01",to:pm+"-"+String(cur?Math.min(NOW.getDate(),lastP):lastP).padStart(2,"0"),label:cur?"no mesmo ponto do mês passado":"em "+mLong(pm)}}}
function gPeriod(t){
  const T=TODAY_D;const ws=weekStart(T);
  if(/ hoje /.test(t))return {from:T,to:T,label:"hoje",type:"day",prev:{from:dateAdd(T,-7),to:dateAdd(T,-7),label:"no mesmo dia da semana passada"}};
  if(/ anteontem /.test(t)){const d=dateAdd(T,-2);return {from:d,to:d,label:"anteontem",type:"day"}}
  if(/ ontem /.test(t)){const d=dateAdd(T,-1);return {from:d,to:d,label:"ontem",type:"day"}}
  if(/ (semana passada|ultima semana) /.test(t))return {from:dateAdd(ws,-7),to:dateAdd(ws,-1),label:"na semana passada",type:"week",prev:{from:dateAdd(ws,-14),to:dateAdd(ws,-8),label:"na semana anterior"}};
  if(/ semana /.test(t))return {from:ws,to:T,label:"nesta semana",type:"week",prev:{from:dateAdd(ws,-7),to:dateAdd(T,-7),label:"no mesmo ponto da semana passada"}};
  const ld=/ ultimos (\d{1,3}) dias /.exec(t);if(ld){const n=+ld[1];return {from:dateAdd(T,-(n-1)),to:T,label:"nos últimos "+n+" dias",type:"range",prev:{from:dateAdd(T,-(2*n-1)),to:dateAdd(T,-n),label:"nos "+n+" dias anteriores"}}}
  if(/ (mes passado|ultimo mes) /.test(t)){const mid=addM(TODAY_M,-1);return mPeriod(mid,"em "+mLong(mid))}
  for(let i=0;i<12;i++){if(t.includes(" "+noAcc(MONTHS[i])+" ")){let y=+TODAY_M.slice(0,4);if(i+1>+TODAY_M.slice(5,7))y--;const mid=y+"-"+String(i+1).padStart(2,"0");return mPeriod(mid,"em "+mLong(mid))}}
  if(/ (esse|este|neste|nesse|no|do) ano /.test(t)){const y=TODAY_M.slice(0,4);return {from:y+"-01-01",to:T,label:"neste ano",type:"year",year:y}}
  return mPeriod(TODAY_M,"neste mês");
}
const GSYN={comida:"cat:alimentacao",alimentacao:"cat:alimentacao",lanche:"k:Lanchonete",lanches:"k:Lanchonete",lanchonete:"k:Lanchonete",restaurante:"k:Restaurante",restaurantes:"k:Restaurante",delivery:"k:Delivery",ifood:"k:Delivery",uber:"k:Uber / táxi",taxi:"k:Uber / táxi",gasolina:"k:Posto",combustivel:"k:Posto",posto:"k:Posto",farmacia:"k:Farmácia",remedio:"k:Farmácia",remedios:"k:Farmácia",padaria:"k:Padaria",cafe:"k:Cafeteria",cafezinho:"k:Cafeteria",bar:"k:Bar",cerveja:"k:Bar",sorvete:"k:Sorveteria",acai:"k:Sorveteria",lazer:"cat:lazer",saude:"cat:saude",transporte:"cat:transporte",compras:"cat:compras",pet:"cat:pets",pets:"cat:pets",mercado:"k:Mercado",supermercado:"k:Mercado",feira:"k:Feira",servicos:"cat:servicos",assinatura:"k:Assinatura",assinaturas:"k:Assinatura",shopee:"k:Loja online",online:"k:Loja online",barbeiro:"k:Barbearia",cabelo:"k:Barbearia"};
function gSubject(t){
  for(const w of t.trim().split(" ")){const s=GSYN[w];if(s){const [ty,v]=s.split(":");return ty==="k"?{type:"k",v,label:v.toLowerCase()}:{type:"cat",v,label:gcat(v).name.toLowerCase()}}}
  const places=[...new Set(gAllItems().map(i=>i.place).filter(p=>p&&p!=="Sem descrição"))];
  for(const p of places){const sg=gSig(p);if(sg.length&&sg.some(w=>t.includes(" "+w+" ")))return {type:"p",v:p,label:p}}
  return null;
}
function gAppCat(t){return S.categories.find(c=>c.id!=="invisiveis"&&gTok(c.name).some(w=>t.includes(" "+w+" ")))||null}
function qItems(P,sub){return gAllItems().filter(i=>i.date>=P.from&&i.date<=P.to&&(!sub||(sub.type==="k"?noAcc(gKind(i)||"")===noAcc(sub.v):sub.type==="cat"?i.cat===sub.v:(noAcc(i.place)===noAcc(sub.v)||gSig(i.place).some(w=>gSig(sub.v).includes(w))))))}
const capF=s=>s.charAt(0).toUpperCase()+s.slice(1);
const vezes=n=>n+(n===1?" vez":" vezes");
function aSpend(P,t,seed){
  const sub=gSubject(t);const its=qItems(P,sub);const tot=its.reduce((a,i)=>a+i.amount,0);const n=its.length;
  const rows=[["Gastos invisíveis",n?brl(tot)+" · "+vezes(n):brl(0)]];
  if(P.prev){const pt=qItems(P.prev,sub).reduce((a,i)=>a+i.amount,0);rows.push([capF(P.prev.label),brl(pt)]);if(pt>0&&tot>0)rows.push(["Diferença",(tot>=pt?"+":"")+pct((tot-pt)/pt)])}
  const ac=gAppCat(t);
  if((P.type==="month"||P.type==="year")&&(!sub||ac)){
    const ms=P.type==="month"?S.months.filter(m=>m.id===P.mid):S.months.filter(m=>m.id.startsWith(P.year));
    const ex=ms.flatMap(m=>m.expenses).filter(e=>!ac||e.cat===ac.id);
    if(ex.length)rows.push([ac?"Contas de "+ac.name.toLowerCase():"Contas do mês",brl(sum(ex,"paid"))+" pagos de "+brl(sum(ex,"planned"))]);
  }
  const title=/ (quantas vezes|vezes) /.test(t)?`${capF(vezes(n))}${sub?" em "+sub.label:""} ${P.label}`:`${capF(P.label)}${sub?" com "+sub.label:""}: ${brl(tot)}`;
  return {title,rows,text:n?say(tot>=(P.type==="day"?150:P.type==="week"?350:900)?"ask_spend_hi":"ask_spend",{},seed):say("ask_none",{},seed)};
}
function qMonth(P){const id=P.type==="month"?P.mid:TODAY_M;return months().find(x=>x.id===id)||null}
function aSobra(P,seed){const x=qMonth(P);if(!x)return {text:say("no_month",{m:mLong(P.mid||TODAY_M)},seed)};const cash=cashNow(months());
  const rows=[["Receitas",brl(x.m.closed?x.ir:x.ip)+(x.m.closed?"":" previstas")],["Despesas",brl(x.m.closed?x.epd:x.ep)+(x.m.closed?"":" previstas")],["Resultado",brl(x.result)]];
  if(x.id===cash.cur)rows.push(["Saldo disponível",brl(cash.total)]);
  return {title:`Sobra de ${mLong(x.id)}: ${brl(x.result)}`,rows,text:say(x.result>=0?"ask_sobra_pos":"ask_sobra_neg",{},seed)}}
function aIncome(P,seed){const x=qMonth(P);if(!x)return {text:say("no_month",{m:mLong(P.mid||TODAY_M)},seed)};
  return {title:`Entrou ${brl(x.ir)} em ${mLong(x.id)}`,rows:[["Previsto",brl(x.ip)],["Recebido",brl(x.ir)],["Falta receber",brl(Math.max(0,x.ip-x.ir))],...x.m.incomes.slice(0,4).map(i=>[i.source,brl(i.received)+" de "+brl(i.planned)])],text:say("ask_income",{},seed)}}
function aPending(P,seed){const x=qMonth(P);if(!x)return {text:say("no_month",{m:mLong(P.mid||TODAY_M)},seed)};
  const pend=x.m.expenses.map(e=>({e,f:(+e.planned||0)-(+e.paid||0)})).filter(r=>r.f>0).sort((a,b)=>b.f-a.f);
  if(!pend.length)return {title:`Tudo pago em ${mLong(x.id)}`,text:say("ask_none",{},seed)};
  return {title:`Faltam ${brl(pend.reduce((a,r)=>a+r.f,0))} em ${pend.length} conta(s)`,rows:pend.slice(0,6).map(r=>[r.e.desc,brl(r.f)]).concat(pend.length>6?[["+ "+(pend.length-6)+" conta(s)",""]]:[]),text:say("ask_pending",{},seed)}}
function aTop(P,seed){const its=qItems(P,null);const g={};its.forEach(i=>{const k=gKind(i)||gcat(i.cat).name;g[k]=(g[k]||0)+i.amount});const top=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!top.length)return {title:`Nada anotado ${P.label}`,text:say("ask_none",{},seed)};
  return {title:`Onde mais saiu ${P.label}`,rows:top.map(([k,v])=>[k,brl(v)]),text:say("ask_top",{k:top[0][0].toLowerCase()},seed)}}
function aGoals(seed){const gs=S.goals||[];if(!gs.length)return {title:"Nenhuma meta ainda",text:"Crie uma em Metas e desafios."};
  return {title:"Suas metas",rows:gs.slice(0,5).map(g=>{const x=goalInfo(g);return [g.name,brl(x.saved)+" de "+brl(x.target)+" · "+pct(x.pct)]}),text:say("ask_goals",{},seed)}}
function gAnswer(text){
  const t=gNorm(text);const P=gPeriod(t);const seed=text+Date.now();
  if(/ (sobrou|sobra|sobrar|sobrando|saldo|quanto tenho|resultado) /.test(t))return aSobra(P,seed);
  if(/ (entrou|entraram|recebi|recebemos|receita|receitas|ganhei|entrada|entradas|renda|salario) /.test(t))return aIncome(P,seed);
  if(/ (a pagar|pendente|pendentes|contas abertas|vencer|quais contas|falta pagar|faltam pagar) /.test(t)||/ faltam? .*pag/.test(t))return aPending(P,seed);
  if(/ metas? /.test(t))return aGoals(seed);
  if(/ (onde|mais gast|gasto mais|gastando mais|maior gasto|maiores gastos|ranking|campeao) /.test(t))return aTop(P,seed);
  if(/ (gastei|gasto|gastos|gastamos|gastando|saiu|sairam|torrei|vezes|despesa|despesas|paguei|quanto) /.test(t))return aSpend(P,t,seed);
  return {text:say("ask_unknown",{},seed)};
}

const HABIT_TAGS={"Delivery":"preguiça de cozinhar","Restaurante":"preguiça de cozinhar","Lanchonete":"fominha","Cafeteria":"vício em café","Padaria":"pãozinho sagrado","Bar":"happy hour eterno","Loja online":"compra por impulso","Loja":"compra por impulso","Uber / táxi":"preguiça de andar","Sorveteria":"carência","Farmácia":"hipocondria","Posto":"vida sobre rodas","Mercado":"fome de mercado","Assinatura":"assinatura esquecida"};
function gHabit(msg){
  const it=msg.items[0];if(!it)return;const kd=gKind(it);if(!kd)return;
  const since=dateAdd(TODAY_D,-6);const its=gAllItems().filter(i=>i.date>=since&&noAcc(gKind(i)||"")===noAcc(kd));
  const lim=["Delivery","Lanchonete","Bar","Loja online","Uber / táxi","Restaurante","Sorveteria"].includes(kd)?3:4;
  if(its.length<lim)return;
  if(Object.values(G).some(d=>d.msgs.some(x=>x.ask&&x.ask.kind===kd&&x.date>=since&&x.id!==msg.id)))return;
  const [catLabel,tag]=habitLabels(kd);
  msg.ask={kind:kd,n:its.length,tag,cat:it.cat,catLabel,q:say("habit",{n:its.length,k:kd.toLowerCase(),cat:catLabel,tag},msg.id),ans:null,reply:""};
}
function gHabitBubble(m){const a=m.ask;
  const fr=gIsFresh(m)&&!a.ans;
  return `<div class="msg bot${fr?" late late2":""}">${gAv()}${fr?TYPING:""}<div class="bub"><div class="gh">${esc(a.q)}</div>${a.ans?`<div class="qtext">${esc(a.reply)}</div>`:readOnly?"":`<div class="gbtns"><button class="chipf" data-act="g-habit" data-msg="${m.id}" data-v="cat">${esc(capF(a.catLabel||gcat(a.cat).name))}</button><button class="chipf" data-act="g-habit" data-msg="${m.id}" data-v="tag">${esc(capF(a.tag))}</button><button class="chipf" data-act="g-habit" data-msg="${m.id}" data-v="ch">Topar 7 dias sem ${esc(a.kind.toLowerCase())}</button></div>`}</div></div>`}

/* ================= fantasma: resumos ================= */
function gRecaps(){
  const out=[];const ws=weekStart(TODAY_D);const all=gAllItems();
  const lw={from:dateAdd(ws,-7),to:dateAdd(ws,-1)};const wk="w"+lw.from;
  const its=all.filter(i=>i.date>=lw.from&&i.date<=lw.to);
  if(its.length&&lsGet("fin-recap-"+wk)!=="1"){const tot=its.reduce((a,i)=>a+i.amount,0);const pt=all.filter(i=>i.date>=dateAdd(ws,-14)&&i.date<=dateAdd(ws,-8)).reduce((a,i)=>a+i.amount,0);
    const g={};its.forEach(i=>{const k=gKind(i)||gcat(i.cat).name;g[k]=(g[k]||0)+i.amount});const top=Object.entries(g).sort((a,b)=>b[1]-a[1])[0];
    out.push({key:wk,title:"Resumo da semana passada",rows:[["Total",brl(tot)+" · "+vezes(its.length)],["Campeão",top[0]+" · "+brl(top[1])],["Semana anterior",brl(pt)]],text:say(tot>pt?"week_up":"week_down",{},wk)})}
  if(NOW.getDate()<=10){const pm=addM(TODAY_M,-1);const mk="m"+pm;const mi=gItems(pm);
    if(mi.length&&lsGet("fin-recap-"+mk)!=="1"){const tot=mi.reduce((a,i)=>a+i.amount,0);
      out.push({key:mk,title:"Fechamento de "+mLong(pm),rows:[["Pequenas compras",brl(tot)+" · "+vezes(mi.length)],["Num ano, nesse ritmo",brl(tot*12)]],text:say("month_recap",{mes:MONTHS[ym(pm).m-1].toLowerCase(),v:brl(tot),ano:brl(tot*12)},mk)})}}
  return out;
}
function gRecapBubble(r){return `<div class="msg bot">${gAv()}<div class="bub recap"><div class="gh">${esc(r.title)}</div><div class="qrows">${r.rows.map(x=>`<div><span>${esc(x[0])}</span><b class="num">${esc(String(x[1]))}</b></div>`).join("")}</div><div class="qtext">${esc(r.text)}</div><div class="gbtns"><button class="chipf" data-act="g-recap-ok" data-key="${r.key}">Valeu, fantasma</button></div></div></div>`}

function gMeBubble(m,fr){const t=new Date(m.ts);const hh=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");return `<div class="msg me${fr?" pop":""}"><div class="bub">${esc(m.text)}<span class="tm">${fmtDate(m.date).slice(0,5)} · ${hh}</span></div></div>`}
function gBotBubble(m,fr){
  const r=m.reply||{};let b="";
  if(r.title)b+=`<div class="gh">${esc(r.title)}</div>`;
  if(r.rows&&r.rows.length)b+=`<div class="qrows">${r.rows.map(x=>`<div><span>${esc(x[0])}</span><b class="num">${esc(String(x[1]))}</b></div>`).join("")}</div>`;
  if(r.text)b+=`<div class="qtext">${esc(r.text)}</div>`;
  if(m.pick&&!m.act&&!m.undone&&!readOnly&&S){const mm=S.months.find(x=>x.id===m.pick.month);b+=`<div class="gbtns">${m.pick.ids.map(id=>{const e=mm&&mm.expenses.find(x=>x.id===id);return e?`<button class="chipf" data-act="g-paypick" data-msg="${m.id}" data-exp="${id}">${esc(e.desc)}</button>`:""}).join("")}</div>`}
  if(m.undone){}
  else if(m.act&&!readOnly)b+=`<div class="gbtns"><button class="linkbtn" data-act="g-undo" data-msg="${m.id}">Desfazer</button></div>`;
  else if(!m.act&&!readOnly)b+=`<div class="gbtns"><button class="linkbtn" data-act="g-delmsg" data-msg="${m.id}">Apagar</button></div>`;
  return `<div class="msg bot${fr?" late":""}">${gAv()}${fr?TYPING:""}<div class="bub">${b}</div></div>`;
}

/* ================= invisíveis: relatórios ================= */
function gRecurring(){
  const since=dateAdd(TODAY_D,-29);const its=gAllItems().filter(i=>i.date>=since);const g={};
  its.forEach(i=>{const k=gKind(i)||i.place;const key=noAcc(k);(g[key]=g[key]||{name:k,n:0,v:0,cat:i.cat});g[key].n++;g[key].v+=i.amount});
  return Object.values(g).filter(x=>x.n>=3).sort((a,b)=>b.v-a.v).slice(0,5);
}
function gEvolution(mid){const out=[];for(let k=5;k>=0;k--){const id=addM(mid,-k);out.push({id,v:gItems(id).reduce((a,i)=>a+i.amount,0)})}return out}
function gEvoBars(ev,cur){const mx=Math.max(...ev.map(e=>e.v),1);return `<div class="evo">${ev.map(e=>`<div class="evo-c ${e.id===cur?"on":""}" title="${esc(mLong(e.id))}: ${brl(e.v)}"><b class="num">${e.v?brlK(e.v):"–"}</b><span class="evo-b"><i style="height:${Math.max(e.v?4:0,e.v/mx*100)}%"></i></span><small>${mShort(e.id)}</small></div>`).join("")}</div>`}
function gTags(items){const g={};items.forEach(i=>{if(i.tag){g[i.tag]=(g[i.tag]||0)+i.amount}});return Object.entries(g).sort((a,b)=>b[1]-a[1])}
